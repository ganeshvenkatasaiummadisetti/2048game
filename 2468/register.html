<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register - 2048</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="bg-art" aria-hidden="true">
    <span class="float-tile tile-2">2</span>
    <span class="float-tile tile-4">4</span>
    <span class="float-tile tile-8">8</span>
    <span class="float-tile tile-16">16</span>
    <span class="float-tile tile-128">128</span>
  </div>

  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-topbar">
        <div class="auth-badge">2048</div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button>
      </div>

      <header class="auth-header">
        <div class="title-wrap">
          <h1>Register</h1>
          <p class="subtitle">Create your account and start playing</p>
        </div>
      </header>

      <main>
        <form id="register-form" class="auth-form">
          <label class="auth-field">
            <span>Username</span>
            <input name="username" placeholder="Choose a username" required />
          </label>

          <label class="auth-field">
            <span>Password</span>
            <input name="password" type="password" placeholder="Create a strong password" required />
          </label>

          <div class="auth-actions">
            <button type="submit" class="restart-btn primary-btn">Create account</button>
            <a href="login.html" class="auth-link">Already have one?</a>
          </div>

          <div id="register-msg" class="auth-message" aria-live="polite"></div>
        </form>
      </main>
    </div>
  </div>

  <script src="auth.js" defer></script>
</body>
</html>
